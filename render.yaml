# Render Blueprint (docs/NETCODE.md, S6): one web service built from the
# Dockerfile. Render gives it an https:// address and passes WebSockets
# through (wss://), sets PORT, and checks /health before sending traffic.
# Free plan: the service sleeps after ~15 min without visitors and takes
# about a minute to wake on the next visit. An experiment: small caps, no
# scaling; raise MAX_ROOMS only after reading the tick stats in the log.
services:
  - type: web
    name: metic99
    runtime: docker
    plan: free
    # The same branch GitHub Pages deploys, so page and server match.
    branch: master
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render's proxy puts the player's address in X-Forwarded-For.
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_ROOMS
        value: "3"
      - key: MAX_PER_IP
        value: "4"
      # Pages that may connect besides this service's own address.
      - key: ALLOWED_ORIGINS
        value: https://jjgp13.github.io
