name: Journal check

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Test the journal tool
        run: python -m unittest discover -s tests/journals -p "test_*.py"
      - name: Check journal coverage
        env:
          JOURNAL_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$JOURNAL_BASE" ]; then
            python tools/journals/sync_journals.py check --base "$JOURNAL_BASE"
          else
            python tools/journals/sync_journals.py check
          fi
