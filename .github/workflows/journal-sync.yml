name: Journal sync

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  journal-sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      JOURNAL_PROJECT: ${{ vars.JOURNAL_PROJECT }}
      JOURNAL_REPOSITORY: ${{ vars.JOURNAL_REPOSITORY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Check the merged snapshot
        env:
          JOURNAL_BASE: ${{ github.event.before }}
        run: |
          if [ -n "$JOURNAL_BASE" ] && [ "$JOURNAL_BASE" != "0000000000000000000000000000000000000000" ]; then
            python tools/journals/sync_journals.py check --base "$JOURNAL_BASE"
          else
            python tools/journals/sync_journals.py check
          fi
          python tools/journals/sync_journals.py sync
      - name: Split the destination into owner and repository name
        if: vars.JOURNAL_SYNC_ENABLED == 'true'
        id: destination
        run: |
          case "$JOURNAL_REPOSITORY" in
            */*) ;;
            *) echo "Set JOURNAL_REPOSITORY to owner/repository." >&2; exit 1 ;;
          esac
          echo "owner=${JOURNAL_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${JOURNAL_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - name: Create a short-lived token for the private journal repository
        if: vars.JOURNAL_SYNC_ENABLED == 'true'
        id: journal-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.JOURNAL_APP_ID }}
          private-key: ${{ secrets.JOURNAL_APP_PRIVATE_KEY }}
          owner: ${{ steps.destination.outputs.owner }}
          repositories: ${{ steps.destination.outputs.name }}
      - name: Publish the journals and revision manifest
        if: vars.JOURNAL_SYNC_ENABLED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOURNAL_DESTINATION_TOKEN: ${{ steps.journal-token.outputs.token }}
        run: python tools/journals/sync_journals.py sync --publish
